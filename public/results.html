<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نتائج الجلسة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .session {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .team-result {
            margin: 10px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 3px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: right;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>نتائج الجلسة</h1>
    <div id="results-container">
        <!-- Results will be populated here -->
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Function to calculate total points as the sum of individual answer points
        function calculateTotalPoints(answers) {
            if (!answers || !Array.isArray(answers)) return 0;
            
            // Sum up all the points from the answers
            const total = answers.reduce((sum, answer) => {
                return sum + (parseFloat(answer.points) || 0);
            }, 0);
            
            // Round to 2 decimal places
            return Math.round(total * 100) / 100;
        }
        
        const socket = io();
        
        // Fetch all session results when page loads
        socket.emit('get-all-results');
        
        socket.on('all-results', (results) => {
            const container = document.getElementById('results-container');
            
            if (results.length === 0) {
                container.innerHTML = '<p>لا توجد نتائج متاحة</p>';
                return;
            }
            
            container.innerHTML = results.map(session => `
                <div class="session">
                    <h2>الجلسة: ${session.name} (المعرف: ${session.sessionId})</h2>
                    <p>تم الإنشاء: ${new Date(session.createdAt).toLocaleString('ar-SA')}</p>
                    <div>
                        ${session.results.map(result => `
                            <div class="team-result">
                                <h3>الفريق: ${result.team.name}</h3>
                                <p>إجمالي النقاط: ${calculateTotalPoints(JSON.parse(result.details).answers)}</p>
                                <table>
                                    <thead>
                                        <tr>
                                            <th>السؤال</th>
                                            <th>وزن السؤال</th>
                                            <th>المحكم</th>
                                            <th>الإجابة</th>
                                            <th>وزن الخيار</th>
                                            <th>أقصى وزن للخيار</th>
                                            <th>النقاط</th>
                                            <th>الحساب</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${JSON.parse(result.details).answers.map(answer => `
                                            <tr>
                                                <td>${answer.questionText || 'غير متاح'}</td>
                                                <td>${answer.questionWeight || '1'}</td>
                                                <td>${answer.judgeName || 'غير متاح'}</td>
                                                <td>${answer.answer || 'غير متاح'}</td>
                                                <td>${answer.optionWeight || '0'}</td>
                                                <td>${answer.maxOptionWeight || '0'}</td>
                                                <td>${answer.points || '0'}</td>
                                                <td>(${answer.optionWeight || '0'} ÷ ${answer.maxOptionWeight || '0'}) × ${answer.questionWeight || '1'} = ${answer.points || '0'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
