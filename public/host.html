<!DOCTYPE html>
<html>
<head>
  <title>Host Judging</title>
  <style>
    .team-controls { margin: 20px 0; }
    .team-list { margin: 10px 0; }
    .answers { margin-top: 20px; border: 1px solid #ccc; padding: 10px; }
    .answer-item { margin: 5px 0; padding: 5px; background: #f5f5f5; }
  </style>
</head>
<body>
  <h1>Host Judging</h1>
  
  <div>
    <h2>Teams</h2>
    <div>
      <input type="text" id="teamInput" placeholder="Team name">
      <button onclick="addTeam()">Add Team</button>
    </div>
    <div id="teamsList" class="team-list"></div>
    <button onclick="setTeams()">Set Teams</button>
  </div>

  <div class="team-controls">
    <h3>Current Team: <span id="currentTeam">None</span></h3>
    <button onclick="previousTeam()">Previous Team</button>
    <button onclick="nextTeam()">Next Team</button>
    <button onclick="endSession()">End Session</button>
  </div>

  <div id="judgeList">
    <h3>Connected Judges:</h3>
    <ul id="judges"></ul>
  </div>
  <button onclick="sendQuestion()">Send Questions</button>

  <div id="answers" class="answers">
    <h3>Answers</h3>
    <div id="answersList"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    socket.emit('join-host');
    let teams = [];
    let currentTeam = 'None';

    function addTeam() {
      const teamName = document.getElementById('teamInput').value;
      if (teamName) {
        teams.push(teamName);
        document.getElementById('teamInput').value = '';
        updateTeamsList();
      }
    }

    function updateTeamsList() {
      const list = document.getElementById('teamsList');
      list.innerHTML = teams.map(team => 
        `<div>${team} <button onclick="removeTeam('${team}')">Remove</button></div>`
      ).join('');
    }

    function removeTeam(team) {
      teams = teams.filter(t => t !== team);
      updateTeamsList();
    }

    function setTeams() {
      socket.emit('set-teams', teams);
    }

    function previousTeam() {
      socket.emit('previous-team');
    }

    function nextTeam() {
      socket.emit('next-team');
    }

    function endSession() {
      socket.emit('end-session');
    }

    function sendQuestion() {
      const questions = [
        {
          text: "What is 2 + 2?",
          choices: ["3", "4", "5", "6"],
          correct: "4"
        },
        {
          text: "What is the capital of France?",
          choices: ["Berlin", "London", "Paris", "Madrid"],
          correct: "Paris"
        },
        {
          text: "Which planet is known as the Red Planet?",
          choices: ["Earth", "Mars", "Jupiter", "Saturn"],
          correct: "Mars"
        }
      ];
      socket.emit('start-question', questions);
    }

    socket.on('teams-set', (teamList) => {
      teams = teamList;
      updateTeamsList();
      currentTeam = teams[0] || 'None';
      document.getElementById('currentTeam').textContent = currentTeam;
    });

    socket.on('team-changed', (team) => {
      currentTeam = team;
      document.getElementById('currentTeam').textContent = team;
    });

    socket.on('judge-list', (judges) => {
      const judgesList = document.getElementById('judges');
      judgesList.innerHTML = judges.map(j => `<li>${j.name}</li>`).join('');
    });

    socket.on('answers-updated', (answers) => {
      const answersList = document.getElementById('answersList');
      answersList.innerHTML = Object.entries(answers).map(([team, teamAnswers]) => {
        const answersHtml = teamAnswers.map(a => {
          // Handle both object and string answers
          const answerText = typeof a.answer === 'object' ? 
            (a.answer.answer || JSON.stringify(a.answer)) : 
            a.answer;
          return `<li>${a.player || 'Unknown'}: ${answerText}</li>`;
        }).join('');
        
        return `
          <div class="answer-item">
            <strong>${team}</strong>:
            <ul>${answersHtml}</ul>
          </div>
        `;
      }).join('');
      console.log('Updated answers display:', answers);
    });
  </script>
</body>
</html>
