<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة التحكيم</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #dbeafe;
      --secondary-color: #64748b;
      --secondary-light: #f1f5f9;
      --danger-color: #ef4444;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --radius: 8px;
    }

    body {
      font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      color: var(--text-primary);
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    .header {
      background: white;
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      color: var(--primary-color);
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header h1::before {
      content: "🎯";
      font-size: 32px;
    }

    .session-badge {
      background: var(--primary-light);
      color: var(--primary-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .session-badge::before {
      content: "●";
      color: var(--success-color);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Grid Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    /* Cards */
    .card {
      background: white;
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border-color);
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-icon {
      width: 24px;
      height: 24px;
      background: var(--primary-light);
      color: var(--primary-color);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* Forms and Inputs */
    select, input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.2s;
      background: white;
      color: var(--text-primary);
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    select[multiple] {
      min-height: 120px;
      resize: vertical;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* Buttons */
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn-secondary {
      background: var(--secondary-color);
      color: white;
    }

    .btn-secondary:hover {
      background: #475569;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn-success {
      background: var(--success-color);
      color: white;
    }

    .btn-success:hover {
      background: #059669;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn-danger {
      background: var(--danger-color);
      color: white;
    }

    .btn-danger:hover {
      background: #dc2626;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    /* Team Controls */
    .team-display {
      background: var(--primary-light);
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
    }

    .team-display h3 {
      color: var(--primary-color);
      font-size: 16px;
      margin-bottom: 8px;
    }

    .team-display .team-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Judge List */
    .judge-list {
      list-style: none;
      padding: 0;
    }

    .judge-list li {
      background: var(--secondary-light);
      padding: 10px 14px;
      margin-bottom: 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .judge-list li:hover {
      background: var(--primary-light);
      transform: translateX(-4px);
    }

    .judge-list li::before {
      content: "👤";
      font-size: 16px;
    }

    /* Answers Section */
    .answers-container {
      max-height: 400px;
      overflow-y: auto;
      padding: 4px;
    }

    .answer-item {
      background: var(--secondary-light);
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 6px;
      border-right: 4px solid var(--primary-color);
    }

    .answer-item strong {
      color: var(--primary-color);
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
    }

    .answer-item ul {
      list-style: none;
      padding-right: 20px;
    }

    .answer-item li {
      padding: 4px 0;
      color: var(--text-secondary);
    }

    /* Leaderboard */
    .leaderboard-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: 12px;
    }

    .leaderboard-table thead {
      background: var(--primary-color);
      color: white;
    }

    .leaderboard-table th {
      padding: 12px;
      text-align: right;
      font-weight: 600;
      font-size: 14px;
    }

    .leaderboard-table tbody tr {
      transition: all 0.2s;
    }

    .leaderboard-table tbody tr:hover {
      background: var(--primary-light);
    }

    .leaderboard-table td {
      padding: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .leaderboard-table tbody tr:first-child td:first-child::before {
      content: "🥇 ";
      font-size: 18px;
    }

    .leaderboard-table tbody tr:nth-child(2) td:first-child::before {
      content: "🥈 ";
      font-size: 18px;
    }

    .leaderboard-table tbody tr:nth-child(3) td:first-child::before {
      content: "🥉 ";
      font-size: 18px;
    }

    /* Quick Actions */
    .quick-actions {
      background: white;
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 20px;
      box-shadow: var(--shadow-md);
    }

    .quick-actions h3 {
      color: var(--text-primary);
      margin-bottom: 16px;
      font-size: 18px;
    }

    .action-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--secondary-light);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--secondary-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary-color);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        padding: 12px;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .header {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }

      .btn-group {
        flex-direction: column;
      }

      .action-links {
        flex-direction: column;
      }
    }

    /* Loading State */
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--primary-light);
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .empty-state::before {
      content: "📋";
      font-size: 48px;
      display: block;
      margin-bottom: 16px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>إدارة التحكيم</h1>
      <div class="session-badge">
        <span>معرف الجلسة:</span>
        <span id="sessionId">لم تبدأ</span>
      </div>
    </div>

    <div class="dashboard-grid">
      <!-- Teams Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <div class="card-icon">👥</div>
            <span>إدارة الفرق</span>
          </div>
        </div>
        <div>
          <label for="teamSelect">اختر الفرق المشاركة:</label>
          <select id="teamSelect" multiple>
            <!-- Teams will be populated from database -->
          </select>
          <button class="btn btn-primary" onclick="setTeams()" style="width: 100%; margin-top: 12px;">
            <span>✓</span>
            تعيين الفرق المحددة
          </button>
        </div>
        
        <div class="team-display">
          <h3>الفريق الحالي</h3>
          <div class="team-name" id="currentTeam">لا يوجد</div>
        </div>
        
        <div class="btn-group">
          <button class="btn btn-secondary" onclick="previousTeam()">
            <span>◀</span>
            السابق
          </button>
          <button class="btn btn-secondary" onclick="nextTeam()">
            <span>▶</span>
            التالي
          </button>
          <button class="btn btn-danger" onclick="endSession()">
            <span>✕</span>
            إنهاء
          </button>
        </div>
      </div>

      <!-- Questions Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <div class="card-icon">❓</div>
            <span>الأسئلة</span>
          </div>
        </div>
        <div>
          <label for="bankSelect">بنك الأسئلة:</label>
          <select id="bankSelect">
            <option value="">جميع الأسئلة</option>
          </select>
          
          <label for="questionSelect" style="margin-top: 12px;">اختر الأسئلة:</label>
          <select id="questionSelect" multiple>
            <!-- Questions will be populated from database -->
          </select>
          
          <button class="btn btn-success" onclick="sendQuestion()" style="width: 100%; margin-top: 12px;">
            <span>📤</span>
            إرسال الأسئلة المحددة
          </button>
        </div>
      </div>

      <!-- Judges Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <div class="card-icon">⚖️</div>
            <span>المحكمون المتصلون</span>
          </div>
        </div>
        <ul id="judges" class="judge-list">
          <li class="empty-state">لا يوجد محكمون متصلون</li>
        </ul>
        <button id="startSessionBtn" class="btn btn-primary" disabled style="width: 100%; margin-top: 12px;">
          <span>▶</span>
          بدء الجلسة
        </button>
      </div>

      <!-- Answers Card -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <div class="card-icon">📝</div>
            <span>الإجابات</span>
          </div>
        </div>
        <div class="answers-container" id="answersList">
          <div class="empty-state">لم يتم استلام إجابات بعد</div>
        </div>
      </div>

      <!-- Leaderboard Card -->
      <div class="card" style="grid-column: span 2;">
        <div class="card-header">
          <div class="card-title">
            <div class="card-icon">🏆</div>
            <span>لوحة المتصدرين</span>
          </div>
        </div>
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>الفريق</th>
              <th style="text-align: left;">إجمالي النقاط</th>
            </tr>
          </thead>
          <tbody id="leaderboardTable">
            <tr>
              <td colspan="2" class="empty-state">لا توجد نتائج بعد</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <h3>الإجراءات السريعة</h3>
      <div class="action-links">
        <a href="/add_questions.html" class="btn btn-success">
          <span>➕</span>
          إضافة/تعديل الأسئلة
        </a>
        <a href="/results.html" class="btn btn-primary">
          <span>📊</span>
          عرض النتائج
        </a>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let teams = [];
    let currentTeam = 'لا يوجد';

    // Check for existing session on page load
    const savedSessionId = localStorage.getItem('hostSessionId');
    const savedHostToken = localStorage.getItem('hostToken');

    if (savedSessionId && savedHostToken) {
      // Attempt to rejoin existing session
      socket.emit('rejoin-host', { 
        sessionId: savedSessionId, 
        hostToken: savedHostToken 
      });
    } else {
      // Join as new host
      socket.emit('join-host');
    }

    function addTeam() {
      const teamName = document.getElementById('teamInput').value;
      if (teamName) {
        teams.push(teamName);
        document.getElementById('teamInput').value = '';
        updateTeamsList();
      }
    }

    // Removed updateTeamsList function because 'teamsList' element does not exist
    // Instead, teams are managed via the 'teamSelect' element

    function removeTeam(team) {
      teams = teams.filter(t => t !== team);
      updateTeamsList();
    }

    function setTeams() {
      const selectedTeams = Array.from(document.querySelectorAll('#teamSelect option:checked'))
        .map(opt => opt.value);
      console.log('Selected teams:', selectedTeams);
      socket.emit('set-teams', selectedTeams);
    }

    function previousTeam() {
      socket.emit('previous-team');
    }

    function nextTeam() {
      socket.emit('next-team');
    }

    function endSession() {
      socket.emit('end-session');
    }

    function sendQuestion() {
      const selectedQuestions = Array.from(document.querySelectorAll('#questionSelect option:checked'))
        .map(opt => ({
          id: opt.value,
          text: opt.textContent
        }));
      
      if (selectedQuestions.length === 0) {
        alert('يرجى اختيار سؤال واحد على الأقل');
        return;
      }
      
      socket.emit('start-question', selectedQuestions);
    }

    socket.on('teams-set', (teamList) => {
      teams = teamList;
      updateTeamsList();
      currentTeam = teams[0] || 'لا يوجد';
      document.getElementById('currentTeam').textContent = currentTeam;
    });

    socket.on('team-changed', (team) => {
      currentTeam = team;
      document.getElementById('currentTeam').textContent = team;
      console.log('Team changed to:', team);
    });

    socket.on('error-message', (message) => {
      alert(message);
    });

    // Enable start session button when ready
    function checkSessionReady() {
      const hasTeams = document.querySelectorAll('#teamSelect option:checked').length > 0;
      const hasQuestions = document.querySelectorAll('#questionSelect option:checked').length > 0;
      const hasJudges = document.getElementById('judges').children.length > 0 && 
                       !document.querySelector('#judges .empty-state');
      document.getElementById('startSessionBtn').disabled = !(hasTeams && hasQuestions && hasJudges);
    }

    // Check session readiness on any change
    document.getElementById('teamSelect').addEventListener('change', checkSessionReady);
    document.getElementById('questionSelect').addEventListener('change', checkSessionReady);
    socket.on('judge-list', (judges) => {
      const judgesList = document.getElementById('judges');
      if (judges.length === 0) {
        judgesList.innerHTML = '<li class="empty-state">لا يوجد محكمون متصلون</li>';
      } else {
        judgesList.innerHTML = judges.map(j => `<li>${j.name}</li>`).join('');
      }
      checkSessionReady();
    });

    // Handle session start
    document.getElementById('startSessionBtn').addEventListener('click', () => {
      socket.emit('start-session');
    });

    socket.on('session-started', (sessionId) => {
      document.getElementById('sessionId').textContent = sessionId;
      alert(`تم بدء الجلسة بالمعرف: ${sessionId}`);
    });

    // Handle session creation with token storage
    socket.on('session-created', (data) => {
      // Store session info in localStorage
      localStorage.setItem('hostSessionId', data.sessionId);
      localStorage.setItem('hostToken', data.hostToken);
      
      document.getElementById('sessionId').textContent = data.sessionId;
      console.log('Session created and stored:', data.sessionId);
    });

    // Handle successful host rejoin
    socket.on('host-rejoined', (data) => {
      teams = data.teams;
      currentTeam = data.currentTeam;
      document.getElementById('currentTeam').textContent = currentTeam;
      document.getElementById('sessionId').textContent = data.sessionId;
      
      console.log('Host successfully rejoined session:', data.sessionId);
      alert(`تم إعادة الانضمام للجلسة: ${data.sessionId}`);
    });

    // Handle rejoin failure
    socket.on('rejoin-failed', (message) => {
      console.log('Rejoin failed:', message);
      // Clear invalid tokens
      localStorage.removeItem('hostSessionId');
      localStorage.removeItem('hostToken');
      
      // Join as new host
      socket.emit('join-host');
      alert('انتهت صلاحية الجلسة السابقة. البدء من جديد.');
    });

    // Handle session ended
    socket.on('session-ended', () => {
      // Clear session data from localStorage
      localStorage.removeItem('hostSessionId');
      localStorage.removeItem('hostToken');
      
      // Reset UI state
      document.getElementById('sessionId').textContent = 'لم تبدأ';
      document.getElementById('currentTeam').textContent = 'لا يوجد';
      document.getElementById('answersList').innerHTML = '<div class="empty-state">لم يتم استلام إجابات بعد</div>';
      document.querySelector('#leaderboardTable').innerHTML = '<tr><td colspan="2" class="empty-state">لا توجد نتائج بعد</td></tr>';
      
      // Clear team selections
      const teamSelect = document.getElementById('teamSelect');
      Array.from(teamSelect.options).forEach(option => option.selected = false);
      
      // Clear question selections
      const questionSelect = document.getElementById('questionSelect');
      Array.from(questionSelect.options).forEach(option => option.selected = false);
      
      alert('تم إنهاء الجلسة. تم مسح جميع البيانات.');
      console.log('Session ended, localStorage and UI cleared');
    });

    socket.on('init-host-data', (data) => {
      console.log('Received host data:', data);
      
      // Populate teams dropdown
      const teamSelect = document.getElementById('teamSelect');
      teamSelect.innerHTML = '';
      console.log('Populating teams:', data.teams);
      data.teams.forEach(team => {
        const option = document.createElement('option');
        option.value = team;
        option.textContent = team;
        teamSelect.appendChild(option);
      });
      console.log('Teams populated in dropdown');

      // Populate question banks dropdown
      const bankSelect = document.getElementById('bankSelect');
      bankSelect.innerHTML = '<option value="">جميع الأسئلة</option>';
      data.questionBanks.forEach(bank => {
        const option = document.createElement('option');
        option.value = bank.id;
        option.textContent = bank.name;
        bankSelect.appendChild(option);
      });

      // Populate questions dropdown
      const questionSelect = document.getElementById('questionSelect');
      questionSelect.innerHTML = '';
      
      // Show all questions by default
      data.questions.forEach(question => {
        const option = document.createElement('option');
        option.value = question.id;
        option.textContent = question.text;
        questionSelect.appendChild(option);
      });

      // Handle bank selection
      bankSelect.addEventListener('change', function() {
        questionSelect.innerHTML = '';
        const bankId = this.value;
        if (bankId) {
          const bank = data.questionBanks.find(b => b.id == bankId);
          if (bank && bank.questions) {
            bank.questions.forEach(question => {
              const option = document.createElement('option');
              option.value = question.id;
              option.textContent = question.text;
              questionSelect.appendChild(option);
            });
          }
        } else {
          // Show all questions when no bank selected
          data.questions.forEach(question => {
            const option = document.createElement('option');
            option.value = question.id;
            option.textContent = question.text;
            questionSelect.appendChild(option);
          });
        }
      });
    });

    socket.on('judge-list', (judges) => {
      const judgesList = document.getElementById('judges');
      if (judges.length === 0) {
        judgesList.innerHTML = '<li class="empty-state">لا يوجد محكمون متصلون</li>';
      } else {
        judgesList.innerHTML = judges.map(j => `<li>${j.name}</li>`).join('');
      }
    });

    socket.on('answers-updated', (answers) => {
      const answersList = document.getElementById('answersList');
      if (Object.keys(answers).length === 0) {
        answersList.innerHTML = '<div class="empty-state">لم يتم استلام إجابات بعد</div>';
      } else {
        answersList.innerHTML = Object.entries(answers).map(([team, teamAnswers]) => {
          const answersHtml = teamAnswers.map(a => {
            // Handle both object and string answers
            const answerText = typeof a.answer === 'object' ? 
              (a.answer.answer || JSON.stringify(a.answer)) : 
              a.answer;
            return `<li>${a.player || 'غير معروف'}: ${answerText}</li>`;
          }).join('');
          
          return `
            <div class="answer-item">
              <strong>${team}</strong>
              <ul>${answersHtml}</ul>
            </div>
          `;
        }).join('');
      }
      console.log('Updated answers display:', answers);
    });

    socket.on('leaderboard-updated', (leaderboard) => {
      const tableBody = document.querySelector('#leaderboardTable');
      if (leaderboard.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="2" class="empty-state">لا توجد نتائج بعد</td></tr>';
      } else {
        tableBody.innerHTML = leaderboard.map(team => `
          <tr>
            <td>${team.teamName}</td>
            <td style="text-align: left; font-weight: 600; color: var(--primary-color);">${team.totalPoints.toFixed(2)}</td>
          </tr>
        `).join('');
      }
    });
    
    // Request updated leaderboard data when the page loads
    socket.on('connect', () => {
      // This will trigger a leaderboard-updated event if there's an active session
      socket.emit('request-leaderboard');
    });
  </script>
</body>
</html>
