<!DOCTYPE html>
<html>
<head>
  <title>Join Judging</title>
</head>
<body>
  <h1>Join Judging</h1>
  <input type="text" id="name" placeholder="Your name">
  <button onclick="joinGame()">Join</button>

  <div id="question-box" style="display:none;">
    <div id="questions-container"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    function joinGame() {
      const name = document.getElementById('name').value;
      socket.emit('join-judging', '1234', name);
    }

    socket.on('joined-success', (name) => {
      document.getElementById('name').style.display = 'none';
      document.getElementById('question-box').style.display = 'block';
      alert(`Welcome ${name} to the Judging Session`);
    });

    socket.on('question', (data) => {
      const container = document.getElementById('questions-container');
      container.innerHTML = '';

      // Check if data is an array (multiple questions) or single question
      if (Array.isArray(data)) {
        data.forEach((question, index) => {
          const questionDiv = document.createElement('div');
          questionDiv.style.marginBottom = '20px';

          const questionTitle = document.createElement('h2');
          questionTitle.innerText = `Q${index + 1}: ${question.text}`;
          questionDiv.appendChild(questionTitle);

          const choicesDiv = document.createElement('div');
          question.choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.innerText = choice;
            btn.onclick = () => socket.emit('submit-answer', { questionIndex: index, answer: choice });
            choicesDiv.appendChild(btn);
          });
          questionDiv.appendChild(choicesDiv);

          container.appendChild(questionDiv);
        });
      } else {
        // Single question fallback
        const questionTitle = document.createElement('h2');
        questionTitle.innerText = data.text;
        container.appendChild(questionTitle);

        const choicesDiv = document.createElement('div');
        data.choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.innerText = choice;
          btn.onclick = () => socket.emit('submit-answer', choice);
          choicesDiv.appendChild(btn);
        });
        container.appendChild(choicesDiv);
      }
    });

    socket.on('error-message', msg => alert(`Judging Error: ${msg}`));
  </script>
</body>
</html>
