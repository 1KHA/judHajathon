<!DOCTYPE html>
<html>
<head>
  <title>Join Judging</title>
  <style>
    .current-team {
      font-size: 1.2em;
      margin: 10px 0;
      padding: 5px;
      background: #f0f0f0;
    }
    .answer-btn {
      margin: 5px;
      padding: 8px 15px;
      background: #e0e0e0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .answer-btn.selected {
      background: #4CAF50;
      color: white;
    }
    .answer-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Join Judging</h1>
  <div id="currentTeam" class="current-team"></div>
  <input type="text" id="name" placeholder="Your name">
  <button onclick="joinGame()">Join</button>

  <div id="question-box" style="display:none;">
    <div id="questions-container"></div>
  </div>

  <div id="sessionInfo">
    <h3>Session ID: <span id="sessionId">Not started</span></h3>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    
    socket.on('session-started', (sessionId) => {
      document.getElementById('sessionId').textContent = sessionId;
    });

    function joinGame() {
      const name = document.getElementById('name').value;
      socket.emit('join-judging', '1234', name);
    }

    socket.on('joined-success', (name) => {
      document.getElementById('name').style.display = 'none';
      document.getElementById('question-box').style.display = 'block';
      alert(`Welcome ${name} to the Judging Session`);
    });

    socket.on('question', (data) => {
      console.log('Received question data:', data);
      document.getElementById('currentTeam').textContent = 
        `Currently judging: ${data.currentTeam || 'No team selected'}`;
      
      const questions = Array.isArray(data.questions) ? data.questions : [data.questions];
      const container = document.getElementById('questions-container');
      container.innerHTML = '';
      console.log('Processing questions:', questions);

      questions.forEach((question, index) => {
        const questionDiv = document.createElement('div');
        questionDiv.style.marginBottom = '20px';

        const questionTitle = document.createElement('h2');
        questionTitle.innerText = `Q${index + 1}: ${question.text}`;
        questionDiv.appendChild(questionTitle);

        const choicesDiv = document.createElement('div');
        question.choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.className = 'answer-btn';
          btn.innerText = choice;
          btn.onclick = () => {
            // Reset all buttons for this question
            choicesDiv.querySelectorAll('.answer-btn').forEach(b => {
              b.classList.remove('selected');
              b.disabled = false;
            });
            // Mark this button as selected
            btn.classList.add('selected');
            btn.disabled = true;
            socket.emit('submit-answer', { questionIndex: index, answer: choice });
          };
          choicesDiv.appendChild(btn);
        });
        questionDiv.appendChild(choicesDiv);
        container.appendChild(questionDiv);
      });
    });

    socket.on('error-message', msg => alert(`Judging Error: ${msg}`));
    socket.on('session-ended', () => {
      alert('The judging session has ended');
      document.getElementById('question-box').style.display = 'none';
      document.getElementById('currentTeam').textContent = 'Session ended';
    });
  </script>
</body>
</html>
